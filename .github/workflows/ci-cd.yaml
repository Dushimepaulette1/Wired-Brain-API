name: Wired Brain workflow # this will show up on github ui as Wired Brain workflow

on:
  workflow_dispatch: #Helps us to manually trigger the workflow from the github ui
  push:
    branches: ['main', 'cicd-learning']
  pull_request:
    branches: ['main']
jobs:
  build:
    runs-on: ubuntu-latest # This specifies the operating system on which the job will run
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - id: build
        name: Build
        run: dotnet build --no-restore

      - id: test
        if: steps.build.outcome == 'success' # This will only run the test step if the build step is successful
        name: Test
        run: dotnet test "WiredBrain.Tests/WiredBrain.Tests.csproj" --no-build --collect "XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - id: coverage
        name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: WiredBrain.Tests/TestResults/**/coverage.cobertura.xml
          badge: false
          fail_below_min: false
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: console
      - id: publish
        name: Publish
        run: dotnet publish "WiredBrainApi.Web/WiredBrainApi.Web.csproj" -c Release -o ./publish --self-contained -r linux-x64 /p:UseAppHost=true

      - name: Zip Artifact
        run: zip -r app.zip ./publish
      - id: upload
        name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-webapi
          path: app.zip
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-webapi
      - name: Azure Login
        if: ${{ github.ref == 'refs/heads/main' && env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}
      - name: Deploy to Azure Web App
        if: ${{ github.ref == 'refs/heads/main' && env.AZURE_CREDENTIALS != '' }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: wiredbrainapi
          package: app.zip
